name: RailOS CI & Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-test:
    name: Backend & Optimizer Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -r apps/api/requirements.txt

      - name: Run Pytest suite
        run: |
          pytest -q

  frontend-build:
    name: Control Center Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: apps/control-center/package-lock.json

      - name: Install npm dependencies
        working-directory: apps/control-center
        run: npm ci

      - name: Build Next.js app
        working-directory: apps/control-center
        env:
          NEXT_PUBLIC_RAILOS_API_URL: "http://localhost:8000"
          NEXT_PUBLIC_MAP_STYLE_URL: "street"
          NEXT_PUBLIC_RAILOS_MODE: "synthetic"
        run: npm run build
