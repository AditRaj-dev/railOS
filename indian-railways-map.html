<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Indian Railways Operations Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body, #map { height: 100%; margin: 0; padding: 0; background: #0f1115; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .floating-card {
      position: absolute; top: 16px; left: 16px; z-index: 1000;
      background: rgba(15, 17, 21, 0.92); backdrop-filter: blur(8px);
      color: #e2e8f0; padding: 14px 18px; border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 24px rgba(0,0,0,0.6); width: 290px;
    }
    .floating-card h2 { margin: 0 0 4px 0; font-size: 15px; color: #38bdf8; }
    .floating-card p { margin: 0 0 12px 0; font-size: 12px; color: #94a3b8; }
    .search-input {
      width: 100%; padding: 8px 10px; box-sizing: border-box;
      background: #1e293b; border: 1px solid #475569; border-radius: 6px;
      color: #fff; font-size: 13px; outline: none; margin-bottom: 10px;
    }
    .search-input:focus { border-color: #38bdf8; }
    .layer-selector {
      width: 100%; padding: 6px 8px; background: #1e293b;
      border: 1px solid #475569; border-radius: 6px; color: #fff; font-size: 13px;
    }
    .status-text { font-size: 11px; color: #64748b; margin-top: 8px; }
    .leaflet-popup-content-wrapper {
      background: #1e293b; color: #f8fafc; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .leaflet-popup-tip { background: #1e293b; }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="floating-card">
    <h2>Indian Railways Operations Map</h2>
    <p>Tracks: OpenRailwayMap | Stations: DataMeet</p>

    <input id="stationSearch" class="search-input" type="text" placeholder="Search Code (e.g. NDLS, GZB, CNB)..." />

    <label style="font-size: 12px; color: #94a3b8; display: block; margin-bottom: 4px;">Track Layer Style:</label>
    <select id="trackStyle" class="layer-selector">
      <option value="standard" selected>Infrastructure (Tracks/Sidings)</option>
      <option value="maxspeed">Max Speeds</option>
      <option value="signals">Signalling & Safety</option>
      <option value="electrified">Electrification</option>
      <option value="gauge">Track Gauge</option>
    </select>

    <div id="statusIndicator" class="status-text">Loading 8,990 stations...</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // 1. Initialize Map centered on India (New Delhi / Ghaziabad corridor)
    const map = L.map('map', {
      center: [28.6139, 77.2090],
      zoom: 8,
      minZoom: 4,
      maxZoom: 19
    });

    // 2. High-contrast Dark Basemap (CARTO Dark Matter)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://carto.com/">CARTO</a> &copy; OpenStreetMap',
      subdomains: 'abcd',
      maxZoom: 19
    }).addTo(map);

    // 3. OpenRailwayMap Track Overlay Layer
    let currentStyle = 'standard';
    const trackLayer = L.tileLayer(`https://{s}.tiles.openrailwaymap.org/${currentStyle}/{z}/{x}/{y}.png`, {
      attribution: 'Tracks: &copy; <a href="https://www.openrailwaymap.org">OpenRailwayMap</a>',
      subdomains: ['a', 'b', 'c'],
      maxZoom: 19,
      tileSize: 256
    }).addTo(map);

    // Track style switch handler
    document.getElementById('trackStyle').addEventListener('change', (e) => {
      currentStyle = e.target.value;
      trackLayer.setUrl(`https://{s}.tiles.openrailwaymap.org/${currentStyle}/{z}/{x}/{y}.png`);
    });

    // 4. Station Markers Layer (DataMeet GeoJSON)
    const stationsLayer = L.layerGroup().addTo(map);
    let allStations = [];

    fetch('https://raw.githubusercontent.com/datameet/railways/master/stations.json')
      .then(res => res.json())
      .then(data => {
        allStations = data.features;
        document.getElementById('statusIndicator').innerText = `Active: ${allStations.length} IR Stations loaded.`;

        function renderVisibleStations() {
          stationsLayer.clearLayers();
          const bounds = map.getBounds();
          const zoom = map.getZoom();

          allStations.forEach(st => {
            const [lon, lat] = st.geometry.coordinates;
            if (bounds.contains([lat, lon])) {
              const name = st.properties.name || '';
              // Plot all when zoomed in, or major junctions when zoomed out
              if (zoom >= 10 || (zoom >= 7 && (name.includes("Junction") || name.includes("Central") || name.includes("Terminus")))) {
                const marker = L.circleMarker([lat, lon], {
                  radius: zoom >= 12 ? 6 : 4,
                  fillColor: '#f59e0b',
                  color: '#ffffff',
                  weight: 1.5,
                  opacity: 1,
                  fillOpacity: 0.9
                });

                marker.bindPopup(`
                  <div style="font-size: 13px;">
                    <b style="color: #38bdf8; font-size: 14px;">${name}</b><br/>
                    <b>Station Code:</b> <span style="color: #f59e0b; font-weight: bold;">${st.properties.code}</span><br/>
                    <b>Zone:</b> ${st.properties.zone || 'N/A'}<br/>
                    <b>State:</b> ${st.properties.state || 'N/A'}
                  </div>
                `);

                stationsLayer.addLayer(marker);
              }
            }
          });
        }

        map.on('moveend', renderVisibleStations);
        renderVisibleStations();
      })
      .catch(err => {
        document.getElementById('statusIndicator').innerText = "Failed to load remote stations JSON.";
        console.error("Error loading stations:", err);
      });

    // 5. Station Code & Name Search
    document.getElementById('stationSearch').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const query = e.target.value.trim().toUpperCase();
        if (!query) return;

        const match = allStations.find(st => 
          (st.properties.code && st.properties.code.toUpperCase() === query) || 
          (st.properties.name && st.properties.name.toUpperCase().includes(query))
        );

        if (match) {
          const [lon, lat] = match.geometry.coordinates;
          map.flyTo([lat, lon], 14, { duration: 1.2 });
          L.popup()
            .setLatLng([lat, lon])
            .setContent(`
              <div style="font-size: 13px;">
                <b style="color: #38bdf8; font-size: 14px;">${match.properties.name}</b><br/>
                <b>Station Code:</b> <span style="color: #f59e0b; font-weight: bold;">${match.properties.code}</span><br/>
                <b>Zone:</b> ${match.properties.zone || 'N/A'}<br/>
                <b>State:</b> ${match.properties.state || 'N/A'}
              </div>
            `)
            .openOn(map);
        } else {
          alert(`Station '${query}' not found. Try 'NDLS', 'HWH', 'GZB', or 'CNB'.`);
        }
      }
    });
  </script>
</body>
</html>
